<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ultimate Generator Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #05050a; color: #fff; overflow-x: hidden; }

        /* ── THE VOID (Lightbox) ── */
        #lightbox {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 10000; display: none;
            justify-content: center; align-items: center; cursor: zoom-out;
        }
        #lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 0 50px rgba(255,255,255,0.1); }

        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; text-align: center; }
        .page { display: none; flex-direction: column; align-items: center; min-height: 90vh; }
        .active { display: flex; }

        /* ── UI Elements ── */
        .hub-title { font-size: 3.5rem; font-weight: 900; margin-bottom: 40px; background: linear-gradient(to right, #fff, #666); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; width: 100%; }
        .card { background: #111; border: 1px solid #222; padding: 50px; border-radius: 30px; cursor: pointer; transition: 0.3s; }
        .card:hover { transform: scale(1.03); border-color: #444; background: #151515; }
        
        .gen-btn { padding: 18px 50px; border-radius: 100px; border: none; font-weight: 900; font-size: 1.1rem; cursor: pointer; margin-bottom: 30px; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px; }
        .btn-animal { background: #00ff88; color: #000; }
        .btn-dino { background: #ff4444; color: #fff; }
        .btn-poke { background: #ffcc00; color: #000; }
        .gen-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }

        /* ── Result Styling ── */
        .result-box { width: 100%; max-width: 550px; background: #0f0f0f; border-radius: 40px; border: 1px solid #222; padding: 30px; display: none; animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        
        .img-container { width: 100%; height: 350px; background: #000; border-radius: 25px; overflow: hidden; margin-bottom: 25px; cursor: zoom-in; }
        .img-container img { width: 100%; height: 100%; object-fit: contain; }
        
        .name-tag { font-size: 2rem; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; }
        .badge { display: inline-block; padding: 6px 18px; border-radius: 10px; font-size: 0.8rem; font-weight: 800; margin: 5px; background: #222; color: #aaa; text-transform: uppercase; }
        .legendary { background: linear-gradient(45deg, #ffd700, #ff8800); color: #000; }

        /* ── Stats Table ── */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 20px; }
        .stat-card { background: #1a1a1a; padding: 10px; border-radius: 12px; border: 1px solid #222; }
        .stat-label { font-size: 0.6rem; color: #666; font-weight: 900; }
        .stat-val { font-size: 1.1rem; font-weight: 700; color: #fff; }

        .type-pill { padding: 4px 12px; border-radius: 6px; margin: 0 4px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        
        .loader { display: none; width: 50px; height: 50px; border: 5px solid #222; border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; margin: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .back { margin-bottom: 20px; cursor: pointer; opacity: 0.5; align-self: flex-start; }
    </style>
</head>
<body>

    <div id="lightbox" onclick="this.style.display='none'"><img id="zoom-img"></div>

    <div class="container">
        <div id="hub" class="page active">
            <h1 class="hub-title">GEN HUB</h1>
            <div class="grid">
                <div class="card" onclick="openPage('animal-page')"><h1>🦁</h1><br>ANIMALS</div>
                <div class="card" onclick="openPage('dino-page')"><h1>🦖</h1><br>DINOSAURS</div>
                <div class="card" onclick="openPage('poke-page')"><h1>⚡</h1><br>POKÉMON</div>
            </div>
        </div>

        <div id="animal-page" class="page">
            <div class="back" onclick="openPage('hub')">← BACK TO HUB</div>
            <button class="gen-btn btn-animal" onclick="getAnimal()">New Animal</button>
            <div class="loader" id="animal-load"></div>
            <div id="animal-res" class="result-box">
                <div class="img-container" onclick="expand(this)"><img id="a-img"></div>
                <h2 class="name-tag" id="a-name"></h2>
            </div>
        </div>

        <div id="dino-page" class="page">
            <div class="back" onclick="openPage('hub')">← BACK TO HUB</div>
            <button class="gen-btn btn-dino" onclick="getDino()">New Dinosaur</button>
            <div class="loader" id="dino-load"></div>
            <div id="dino-res" class="result-box">
                <div class="img-container" onclick="expand(this)"><img id="d-img"></div>
                <h2 class="name-tag" id="d-name"></h2>
            </div>
        </div>

        <div id="poke-page" class="page">
            <div class="back" onclick="openPage('hub')">← BACK TO HUB</div>
            <button class="gen-btn btn-poke" onclick="getPoke()">Catch Pokémon</button>
            <div class="loader" id="poke-load"></div>
            <div id="poke-res" class="result-box">
                <div class="img-container" onclick="expand(this)"><img id="p-img"></div>
                <div id="p-meta"></div>
                <h2 class="name-tag" id="p-name"></h2>
                <div id="p-types" style="margin-bottom: 15px;"></div>
                <div class="stats-grid" id="p-stats"></div>
            </div>
        </div>
    </div>

    <script>
        const genMap = { "generation-i": 1, "generation-ii": 2, "generation-iii": 3, "generation-iv": 4, "generation-v": 5, "generation-vi": 6, "generation-vii": 7, "generation-viii": 8, "generation-ix": 9 };
        const typeColors = { fire:'#ff4422', water:'#3399ff', grass:'#77cc55', electric:'#ffcc33', psychic:'#ff5599', ice:'#66ccff', dragon:'#7766ee', dark:'#775544', fairy:'#ee99ee', normal:'#aaaa99', fighting:'#bb5544', flying:'#8899ff', poison:'#aa5599', ground:'#ddbb55', rock:'#bbaa66', bug:'#aabb22', ghost:'#6666bb', steel:'#aaaabb' };

        // Lists to prevent getting "Mammals" or "Teeth"
        const animalList = ["Lion", "Tiger", "Grizzly Bear", "Orca", "Great White Shark", "Snow Leopard", "Red Panda", "Capybara", "Axolotl", "African Elephant", "Giraffe", "Honey Badger", "Komodo Dragon", "Platypus", "King Cobra", "Bald Eagle", "Emperor Penguin", "Gray Wolf", "Cheetah", "Jaguar", "Hippopotamus", "Gorilla", "Red Kangaroo", "Moose", "Sloth", "Narwhal", "Fennec Fox", "Sea Otter"];
        const dinoList = ["Tyrannosaurus", "Triceratops", "Velociraptor", "Spinosaurus", "Stegosaurus", "Brachiosaurus", "Ankylosaurus", "Diplodocus", "Allosaurus", "Carnotaurus", "Dilophosaurus", "Giganotosaurus", "Parasaurolophus", "Therizinosaurus", "Baryonyx", "Iguanodon", "Pachycephalosaurus", "Deinonychus", "Utahraptor"];

        function openPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function expand(el) {
            document.getElementById('zoom-img').src = el.querySelector('img').src;
            document.getElementById('lightbox').style.display = 'flex';
        }

        async function wikiFetch(type, list) {
            const loader = document.getElementById(type + '-load');
            const res = document.getElementById(type + '-res');
            loader.style.display = 'block'; res.style.display = 'none';

            const name = list[Math.floor(Math.random() * list.length)];
            try {
                const response = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${name}`);
                const data = await response.json();
                
                document.getElementById(type.charAt(0) + '-img').src = data.originalimage.source;
                document.getElementById(type.charAt(0) + '-name').textContent = data.title;
                loader.style.display = 'none'; res.style.display = 'block';
            } catch (e) { getAnimal(); }
        }

        const getAnimal = () => wikiFetch('animal', animalList);
        const getDino = () => wikiFetch('dino', dinoList);

        async function getPoke() {
            const loader = document.getElementById('poke-load');
            const res = document.getElementById('poke-res');
            loader.style.display = 'block'; res.style.display = 'none';

            try {
                // Randomly pick from the full 1025 national dex
                const id = Math.floor(Math.random() * 1025) + 1;
                const pRes = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
                const pData = await pRes.json();
                const sRes = await fetch(pData.species.url);
                const sData = await sRes.json();

                document.getElementById('p-img').src = pData.sprites.other['official-artwork'].front_default;
                
                let name = pData.name.replace(/-/g, ' ');
                let metaHTML = `<span class="badge">Gen ${genMap[sData.generation.name] || '?'}</span>`;
                
                if (sData.is_legendary || sData.is_mythical) {
                    name = "⭐ LEGENDARY " + name;
                    metaHTML += `<span class="badge legendary">Legendary</span>`;
                }

                document.getElementById('p-meta').innerHTML = metaHTML;
                document.getElementById('p-name').textContent = name;
                
                document.getElementById('p-types').innerHTML = pData.types.map(t => 
                    `<span class="type-pill" style="background:${typeColors[t.type.name]}">${t.type.name}</span>`).join('');

                const stats = pData.stats;
                document.getElementById('p-stats').innerHTML = `
                    <div class="stat-card"><div class="stat-label">HEALTH</div><div class="stat-val">${stats[0].base_stat}</div></div>
                    <div class="stat-card"><div class="stat-label">ATTACK</div><div class="stat-val">${stats[1].base_stat}</div></div>
                    <div class="stat-card"><div class="stat-label">DEFENSE</div><div class="stat-val">${stats[2].base_stat}</div></div>
                    <div class="stat-card"><div class="stat-label">SP. ATK</div><div class="stat-val">${stats[3].base_stat}</div></div>
                    <div class="stat-card"><div class="stat-label">SP. DEF</div><div class="stat-val">${stats[4].base_stat}</div></div>
                    <div class="stat-card"><div class="stat-label">SPEED</div><div class="stat-val">${stats[5].base_stat}</div></div>
                `;

                loader.style.display = 'none'; res.style.display = 'block';
            } catch (e) { getPoke(); }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Random Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #0a0a1a; color: #fff; overflow-x: hidden; }

        /* ── Lightbox (Solid Black Background) ── */
        #lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; /* Pure black, no transparency */
            z-index: 9999; display: none;
            justify-content: center; align-items: center; cursor: zoom-out;
        }
        #lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .page { display: none; min-height: 100vh; padding: 20px; flex-direction: column; align-items: center; }
        .page.active { display: flex; }

        /* ── Cards ── */
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 900px; width: 100%; margin-top: 50px; }
        .card { background: rgba(255,255,255,0.05); padding: 40px; border-radius: 20px; text-align: center; cursor: pointer; transition: 0.3s; border: 1px solid rgba(255,255,255,0.1); }
        .card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.1); }
        .card-icon { font-size: 3rem; margin-bottom: 10px; display: block; }

        /* ── Result Display ── */
        .result-card { background: rgba(255,255,255,0.03); border-radius: 20px; padding: 25px; width: 100%; max-width: 500px; text-align: center; margin-top: 20px; border: 1px solid rgba(255,255,255,0.1); display: none; }
        .result-img-wrap { width: 100%; height: 300px; background: #000; border-radius: 15px; overflow: hidden; margin-bottom: 20px; cursor: zoom-in; }
        .result-img-wrap img { width: 100%; height: 100%; object-fit: contain; }
        
        .gen-btn { padding: 15px 40px; border-radius: 50px; border: none; color: #fff; font-weight: 800; cursor: pointer; margin: 20px 0; transition: 0.3s; }
        .animal-btn { background: #10b981; }
        .dino-btn { background: #ef4444; }
        .poke-btn { background: #f59e0b; }

        .badge { display: inline-block; padding: 5px 15px; border-radius: 5px; font-size: 0.75rem; margin: 5px; font-weight: bold; background: rgba(255,255,255,0.1); }
        .legend-badge { background: linear-gradient(45deg, #f59e0b, #ef4444); color: white; }
        
        .loader { display: none; width: 40px; height: 40px; border: 4px solid #333; border-top-color: #fff; border-radius: 50%; animation: spin 1s infinite linear; margin: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .back-btn { align-self: flex-start; cursor: pointer; opacity: 0.6; }
    </style>
</head>
<body>

    <div id="lightbox" onclick="this.style.display='none'"><img id="lightbox-img"></div>

    <div id="home" class="page active">
        <h1 style="margin-top: 50px; font-size: 2.5rem;">Random Hub</h1>
        <div class="cards-grid">
            <div class="card" onclick="showPage('animal-page')"><span class="card-icon">🦁</span><h2>Animals</h2></div>
            <div class="card" onclick="showPage('dino-page')"><span class="card-icon">🦕</span><h2>Dinosaurs</h2></div>
            <div class="card" onclick="showPage('pokemon-page')"><span class="card-icon">⚡</span><h2>Pokémon</h2></div>
        </div>
    </div>

    <div id="animal-page" class="page">
        <div class="back-btn" onclick="showPage('home')">← Back</div>
        <button class="gen-btn animal-btn" onclick="getAnimal()">Generate Animal</button>
        <div class="loader" id="animal-load"></div>
        <div id="animal-res" class="result-card">
            <div class="result-img-wrap" onclick="zoom(this)"><img id="a-img"></div>
            <h2 id="a-name"></h2>
        </div>
    </div>

    <div id="dino-page" class="page">
        <div class="back-btn" onclick="showPage('home')">← Back</div>
        <button class="gen-btn dino-btn" onclick="getDino()">Generate Dinosaur</button>
        <div class="loader" id="dino-load"></div>
        <div id="dino-res" class="result-card">
            <div class="result-img-wrap" onclick="zoom(this)"><img id="d-img"></div>
            <h2 id="d-name"></h2>
        </div>
    </div>

    <div id="pokemon-page" class="page">
        <div class="back-btn" onclick="showPage('home')">← Back</div>
        <button class="gen-btn poke-btn" onclick="getPokemon()">Generate Pokémon</button>
        <div class="loader" id="poke-load"></div>
        <div id="poke-res" class="result-card">
            <div class="result-img-wrap" onclick="zoom(this)"><img id="p-img"></div>
            <div id="p-badges"></div>
            <h2 id="p-name"></h2>
        </div>
    </div>

    <script>
        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function zoom(el) {
            const img = el.querySelector('img');
            if(!img.src || img.src.includes('undefined')) return;
            document.getElementById('lightbox-img').src = img.src;
            document.getElementById('lightbox').style.display = 'flex';
        }

        // --- Animal/Dino Logic (Using High-Quality Image Filtering) ---
        async function fetchWiki(type) {
            const loader = document.getElementById(type + '-load');
            const resDiv = document.getElementById(type + '-res');
            loader.style.display = 'block';
            resDiv.style.display = 'none';

            try {
                // Fetching from a curated list of biological names to ensure higher image success
                const category = type === 'animal' ? 'Category:Mammals' : 'Category:Dinosaurs';
                const listUrl = `https://en.wikipedia.org/w/api.php?action=query&list=categorymembers&cmtitle=${category}&cmlimit=500&format=json&origin=*`;
                const listRes = await fetch(listUrl);
                const listData = await listRes.json();
                const pages = listData.query.categorymembers.filter(p => !p.title.includes(':'));
                const randomTitle = pages[Math.floor(Math.random() * pages.length)].title;

                const detailUrl = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(randomTitle)}`;
                const detailRes = await fetch(detailUrl);
                const data = await detailRes.json();

                const imgTag = document.getElementById(type === 'animal' ? 'a-img' : 'd-img');
                const nameTag = document.getElementById(type === 'animal' ? 'a-name' : 'd-name');

                // Ensure we get a real image or try again once
                if (!data.originalimage) { 
                    fetchWiki(type); 
                    return; 
                }

                imgTag.src = data.originalimage.source;
                nameTag.textContent = data.title;
                loader.style.display = 'none';
                resDiv.style.display = 'block';
            } catch (e) {
                loader.style.display = 'none';
            }
        }

        const getAnimal = () => fetchWiki('animal');
        const getDino = () => fetchWiki('dino');

        // --- Pokémon Logic (Full Pokedex + Mega/Legendary) ---
        async function getPokemon() {
            const loader = document.getElementById('poke-load');
            const resDiv = document.getElementById('poke-res');
            loader.style.display = 'block';
            resDiv.style.display = 'none';

            try {
                // Range includes Megas, Alolan, Galar, etc.
                const id = Math.floor(Math.random() * 1025) + 1; 
                const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
                const data = await res.json();

                const speciesRes = await fetch(data.species.url);
                const speciesData = await speciesRes.json();

                document.getElementById('p-img').src = data.sprites.other['official-artwork'].front_default;
                
                let name = data.name.replace(/-/g, ' ');
                let badges = `<span class="badge">Generation ${speciesData.generation.name.split('-')[1].toUpperCase()}</span>`;
                
                if (speciesData.is_legendary || speciesData.is_mythical) {
                    name = "⭐ LEGENDARY " + name;
                    badges += `<span class="badge legend-badge">Legendary/Mythical</span>`;
                }
                
                if (data.name.includes('-mega')) {
                    name = "MEGA " + name.replace('mega', '');
                    badges += `<span class="badge" style="background:#444">Mega Form</span>`;
                }

                document.getElementById('p-name').textContent = name;
                document.getElementById('p-badges').innerHTML = badges;

                loader.style.display = 'none';
                resDiv.style.display = 'block';
            } catch (e) {
                loader.style.display = 'none';
                getPokemon(); // Retry on failure
            }
        }
    </script>
</body>
</html>
